[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-anything-db"
version = "0.0.1"
description = "Atomic-layer database for probabilistic forecasts: targets, forecasts, outcomes."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2.0"]

[tool.setuptools.packages.find]
include = ["forecast_anything_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
